name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable Release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset portable
      - name: Build
        run: cmake --build --preset portable --parallel
      - name: Test
        run: ctest --preset portable

  windows:
    name: Windows x64 build, tests, and downloads
    uses: ./.github/workflows/build-windows.yml
